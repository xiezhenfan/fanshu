<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 我是一个大番薯</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap-icons.min.css') }}" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-body {
            padding: 30px;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #5a6fd6 0%, #6a4190 100%);
        }
        .lang-dropdown {
            position: absolute;
            top: 15px;
            right: 15px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <select id="loginLangSelect" class="form-select form-select-sm" style="position: absolute; top: 15px; right: 15px; width: auto;">
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
                <option value="en">English</option>
            </select>
            <div style="text-align: center;">
                <img id="loginLogo" src="" style="display:none; width:100px; height:100px; border-radius:50%; margin-bottom:10px;" alt="Logo">
            </div>
            <h3>我是一个大番薯</h3>
            <p class="mb-0">请登录以继续</p>
        </div>
        <div class="login-body">
            {% if error %}
            <div class="alert alert-danger" role="alert">
                <i class="bi bi-exclamation-triangle"></i> {{ error }}
            </div>
            {% endif %}
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label for="username" class="form-label" data-i18n="login.username">用户名</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="username" name="username" required autofocus>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label" data-i18n="login.password">密码</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right"></i> <span data-i18n="login.submit">登录</span>
                </button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const loginI18n = {
            'zh-CN': {
                title: '我是一个大番薯',
                subtitle: '请登录以继续',
                username: '用户名',
                password: '密码',
                submit: '登录'
            },
            'zh-TW': {
                title: '我是一個大番薯',
                subtitle: '請登入以繼續',
                username: '用戶名',
                password: '密碼',
                submit: '登入'
            },
            'en': {
                title: 'I am a Big Sweet Potato',
                subtitle: 'Please login to continue',
                username: 'Username',
                password: 'Password',
                submit: 'Login'
            }
        };

        function updateLoginLanguage(lang) {
            const texts = loginI18n[lang] || loginI18n['zh-CN'];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (texts[key]) {
                    el.textContent = texts[key];
                }
            });
        }

        // 初始化语言 / Initialize language
        (function() {
            const savedLang = localStorage.getItem('language') || 'zh-CN';
            const langSelect = document.getElementById('loginLangSelect');
            if (langSelect) {
                langSelect.value = savedLang;
                langSelect.addEventListener('change', (e) => {
                    localStorage.setItem('language', e.target.value);
                    updateLoginLanguage(e.target.value);
                    location.reload();
                });
            }
            updateLoginLanguage(savedLang);
        })();

        // 加载Logo / Load logo
        fetch('/api/logo')
            .then(res => res.json())
            .then(data => {
                if (data.success && data.logo_url) {
                    document.getElementById('loginLogo').src = data.logo_url + '?t=' + Date.now();
                    document.getElementById('loginLogo').style.display = 'block';
                }
            })
            .catch(() => {});
    </script>
</body>
</html>
